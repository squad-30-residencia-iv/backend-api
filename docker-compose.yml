# Banco PostgreSQL local para desenvolvimento.
# Subir:  docker compose up -d
# Parar:  docker compose down        (os dados ficam no volume)
# Zerar:  docker compose down -v     (apaga o volume e os dados)
services:
  postgres:
    image: postgres:17-alpine
    container_name: vouchercampaigns-db
    environment:
      POSTGRES_DB: vouchercampaigns
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vouchercampaigns"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
